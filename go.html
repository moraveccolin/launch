<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Claude…</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0A2A25;color:#E2F4ED;
       display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;text-align:center}
  .box{max-width:30rem;padding:1.5rem}
  a{color:#12A27A;font-weight:600}
  .cmd{font-family:ui-monospace,Menlo,monospace;background:#0D5846;color:#fff;padding:.25rem .5rem;border-radius:.3rem;display:inline-block;margin-top:.5rem;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <p id="msg">Opening Claude…</p>
  <noscript>Enable JavaScript, or <a href="https://claude.ai/new">open claude.ai/new</a> manually.</noscript>
</div>
<script>
(function () {
  try {
    var p = new URLSearchParams(window.location.search);
    var q = p.get("q") || "";
    var dest = "https://claude.ai/new" + (q ? ("?q=" + encodeURIComponent(q)) : "");
    var a = document.createElement("a");
    a.href = dest; a.textContent = "Continue to Claude →";
    document.querySelector(".box").insertAdjacentHTML("beforeend",
      '<p style="margin-top:1rem;font-size:.85rem;opacity:.8">If nothing happens, click below.</p>');
    if (q) {
      var c = document.createElement("div"); c.className = "cmd"; c.textContent = q;
      document.querySelector(".box").appendChild(c);
    }
    document.querySelector(".box").appendChild(a);
    window.location.replace(dest);
  } catch (e) {
    document.getElementById("msg").innerHTML =
      'Could not redirect automatically. <a href="https://claude.ai/new">Open claude.ai/new</a>.';
  }
})();
</script>
</body>
</html>
